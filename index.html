<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roma App - Surplus Food Deals</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

  <main class="landing-container">
    <section class="mockup">
      <div class="iphone-frame">
        <div class="screen">
          <div class="header">Roma</div>
          <img src="https://cdn.pixabay.com/photo/2017/01/31/13/14/spaghetti-2028756_1280.jpg" alt="Surplus Food" class="mockup-img">
          <div class="mockup-search">
            <i data-feather="search"></i>
            <input type="text" placeholder="Enter location" />
          </div>
          <div class="bottom-nav">
            <i data-feather="home"></i>
            <i data-feather="search"></i>
            <i data-feather="user"></i>
          </div>
        </div>
      </div>
    </section>

    <section class="content">
      <h1>restaurant-style food<br>at a reduced cost</h1>
      <div class="location-search">
        <i data-feather="map-pin"></i>
        <input type="text" placeholder="Enter location">
      </div>
      <div class="app-buttons">
        <a href="#"><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="App Store" /></a>
        <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" /></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    &copy; 2024 WordPress
  </footer>

  <script>
    feather.replace();
  </script>
</body>
</html>
