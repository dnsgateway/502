<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1 New Alert Waiting </title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <main class="landing-container">

    <!-- Left iPhone mockup -->
    <section class="mockup">
      <div class="iphone-frame">
        <div class="screen">
          <div class="top-bar">
            <span class="menu"><i data-feather="menu"></i></span>
            <h2>Trending</h2>
            <span class="spacer"></span>
          </div>

          <img src="B4AC8294-6112-4EEF-9301-C911A594ACE3.png" class="mockup-img" alt="Spaghetti Plate">

          <div class="mockup-content">
            <h3>Search local eateries and more</h3>

            <div class="search-bar">
              <i data-feather="search"></i>
              <input type="text" placeholder="Enter location or zip">
            </div>

            <div class="categories">
              <div class="cat"><img src="IMG_0509.jpeg"><span>Discounted meals</span></div>
              <div class="cat"><img src="IMG_0506.jpeg"><span>Groceries</span></div>
              <div class="cat"><img src="9B803AB6-5581-43FD-B274-8ADADC2E0C19.png"><span>Bakery</span></div>
            </div>

            <div class="near-you">
              <img src="IMG_0510.jpeg" alt="Bella Cucina">
              <div>
                <strong>Bella Cucina</strong><br>
                <small>Italian, Pasta, Pizza</small><br>
                <span class="stars">⭐ 4.5 &nbsp; • &nbsp; 30–40 min</span>
              </div>
            </div>

            <button class="order-btn">Order now</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Right content -->
    <section class="content">
      <h1>Quality food<br>at a reduced cost</h1>
      <div class="location-search">
        <i data-feather="map-pin"></i>
        <input type="text" placeholder="Enter location or zip">
      </div>
      <div class="app-buttons">
        <a href="#"><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="App Store" /></a>
        <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" /></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    &copy; 2024 WordPress
  </footer>

  <script>feather.replace();</script>
</body>
</html>
